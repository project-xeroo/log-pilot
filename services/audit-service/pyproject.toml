[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpilot-audit-service"
version = "0.1.0"
description = "LogPilot Audit Service — export incident reports as PDF/Markdown"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "weasyprint>=61",
    "jinja2>=3.1",
    "markdown>=3.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "logpilot-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
