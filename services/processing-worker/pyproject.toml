[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpilot-processing-worker"
version = "0.1.0"
description = "LogPilot Processing Worker — anomaly detection, embeddings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "celery>=5.4",
    "redis>=5.0",
    "logpilot-shared @ file://../../../shared",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
