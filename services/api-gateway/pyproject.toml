[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpilot-api-gateway"
version = "1.0.0"
description = "LogPilot Agent API Gateway — JWT auth, RBAC, WebSocket relay, audit logging"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",   # sync sessions for reports/users/outcomes routes
    "redis>=5.0",             # WebSocket event relay
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "httpx>=0.27",        # For forwarding to microservices
    "python-multipart>=0.0.9",   # log upload proxy (multipart form data)
    "websockets>=12.0",
    "logpilot-shared",
]

[project.optional-dependencies]
pdf = ["markdown>=3.6", "weasyprint>=61"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",        # in-memory DB for route tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
