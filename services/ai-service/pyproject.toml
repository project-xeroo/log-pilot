[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpilot-ai-service"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "logpilot-shared",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
pdf = ["markdown>=3.6", "weasyprint>=61"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
