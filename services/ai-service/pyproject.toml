[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logpilot-ai-service"
version = "1.0.0"
description = "LogPilot AI Service — search, conversational chat, RCA, deployment comparison, report drafting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "openai>=1.30",          # OpenAI-compatible client (works with any compatible provider)
    "tiktoken>=0.7",         # Token counting for context window management
    "tenacity>=8.3",         # Retry logic for cloud API calls
    "redis>=5.0",            # Agent Feed live events
    "logpilot-shared",
]

[project.optional-dependencies]
pdf = ["markdown>=3.6", "weasyprint>=61"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.3",
    "respx>=0.21",           # Mock httpx for provider tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
