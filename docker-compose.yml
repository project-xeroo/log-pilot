version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: logpilot
      POSTGRES_PASSWORD: logpilot
      POSTGRES_DB: logpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the uploads bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/logpilot-uploads &&
        echo 'Bucket ready.'
      "

  # ── Application Services ───────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://logpilot:logpilot@postgres:5432/logpilot
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      INGESTION_SERVICE_URL: http://log-ingestion-service:8001
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  log-ingestion-service:
    build:
      context: .
      dockerfile: services/log-ingestion-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://logpilot:logpilot@postgres:5432/logpilot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BUCKET: logpilot-uploads
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  processing-worker:
    build:
      context: .
      dockerfile: services/processing-worker/Dockerfile
    environment:
      DATABASE_URL_SYNC: postgresql://logpilot:logpilot@postgres:5432/logpilot
      DATABASE_URL: postgresql+asyncpg://logpilot:logpilot@postgres:5432/logpilot
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BUCKET: logpilot-uploads
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2    # Two workers for Phase 1 throughput target

  # ── DB Migration runner ────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: services/log-ingestion-service/Dockerfile
    command: alembic -c services/log-ingestion-service/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://logpilot:logpilot@postgres:5432/logpilot
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
  minio_data:
