version: "3.9"

# ── LogPilot — Phase: Proactive Failure Forecasting & Autonomy Model ─────────
# All services + infrastructure in one compose file for local development.
# For production, see infra/k8s/ (Kubernetes) or infra/terraform/ (cloud IaC).

x-common-env: &common-env
  DATABASE_URL: "postgresql+asyncpg://logpilot:logpilot@postgres:5432/logpilot"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  AI_PROVIDER: "stub"
  AI_API_KEY: ""
  AI_BASE_URL: ""
  JWT_SECRET_KEY: "dev-secret-change-in-production"
  ENVIRONMENT: "development"
  FORECASTING_LOOP_INTERVAL_SECONDS: "60"
  FORECASTING_WARNING_THRESHOLD: "60"
  FORECASTING_CRITICAL_THRESHOLD: "80"

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: logpilot
      POSTGRES_PASSWORD: logpilot
      POSTGRES_DB: logpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Database migrations ────────────────────────────────────────────────────

  migrate:
    build:
      context: .
      dockerfile: services/forecasting-service/Dockerfile
    command: >
      sh -c "
        until pg_isready -h postgres -U logpilot; do sleep 1; done;
        alembic -c alembic.ini upgrade head
      "
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://logpilot:logpilot@postgres:5432/logpilot"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/forecasting-service

  # ── API Gateway ────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Forecasting Service (Celery worker + beat) ─────────────────────────────

  forecasting-worker:
    build:
      context: .
      dockerfile: services/forecasting-service/Dockerfile
    command: celery -A app.loop.celery_app worker --loglevel=info --concurrency=4
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
    working_dir: /app/services/forecasting-service

  forecasting-beat:
    build:
      context: .
      dockerfile: services/forecasting-service/Dockerfile
    command: celery -A app.loop.celery_app beat --loglevel=info
    environment:
      <<: *common-env
    depends_on:
      forecasting-worker:
        condition: service_started
    volumes:
      - .:/app
    working_dir: /app/services/forecasting-service

  # ── AI Service ─────────────────────────────────────────────────────────────

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - .:/app
    working_dir: /app/services/ai-service

  # ── Notification Service ───────────────────────────────────────────────────

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - .:/app
    working_dir: /app/services/notification-service

  # ── Audit Service ──────────────────────────────────────────────────────────

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
    volumes:
      - .:/app
    working_dir: /app/services/audit-service

volumes:
  postgres_data:
